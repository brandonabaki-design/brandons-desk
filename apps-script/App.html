    var isItem = tag === 'li' || isCheckbox || /task|todo/i.test(cls);

/* ---------- Agenda ---------- */
function loadAgenda(meetingDate) {

}
/* Unsaved Questions/Notes/Documents edits are not thrown away silently: the action waits behind a toast with a "Discard edits" button

}

function autoGrow(ta) {

/* ---------- downloads and clipboard ---------- */
function downloadBlob(name, blob) {
  var url = URL.createObjectURL(blob);
  var a = h('a', { href: url, download: name, target: '_blank', rel: 'noopener' });
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
/* Resolves 'ok' once the deferred SheetJS script is usable, 'failed' when its onerror fired, or 'timeout' after 15 s of

    var status = function () { return window.XLSX ? 'ok' : (window.__xlsxFailed ? 'failed' : ''); };
    if (status()) { resolve(status()); return; }
    var waiting = toast('Preparing the spreadsheet…', { timeout: 15000 });
    var tries = 0, iv = setInterval(function () {
      tries++;
      if (status() || tries > 150) { clearInterval(iv); waiting.dismiss(); resolve(status() || 'timeout'); }
    }, 100);
  });
}
function downloadWorkbook(built) {
  return xlsxReady().then(function (status) {
    if (status === 'ok') {
      try {

        built.links.forEach(function (l) { var addr = XLSX.utils.encode_cell({ r: l.r, c: l.c }); if (ws[addr]) ws[addr].l = { Target: l.url }; });
        ws['!cols'] = built.cols;
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, built.sheetName);
        XLSX.writeFile(wb, built.fileName + '.xlsx');
        toast('Downloaded ' + built.fileName + '.xlsx', { type: 'ok' });
        return 'xlsx';
      } catch (e) { toast('Excel export failed (' + errText(e) + '), downloading CSV instead', { type: 'error' }); }
    } else if (status === 'timeout') {
      toast('The spreadsheet library has not loaded yet, so this is a .csv instead of .xlsx; try again in a moment', { timeout: 6000 });
    } else {
      toast('The spreadsheet library did not load, so this is a .csv instead of .xlsx', { timeout: 6000 });
    }

  });
}
function copyText(text) {

    document.body.appendChild(ta); ta.focus(); ta.select();

  }

}
