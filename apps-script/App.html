<script>

function cmpStr(a, b) { a = String(a || ''); b = String(b || ''); return a < b ? -1 : a > b ? 1 : 0; }

/* A getAgenda / regenerateAgenda answer with every section present, each row's fields as text and its `generated` kept (it goes

/* Import preview: same rules as SPEC.md section 6 (text). Returns [{include, category, title, project, done, due, priority, link, source, raw}]. */
function parseImportText(text, defaultCategory) {
  var rows = [], project = '';
  var category0 = CATEGORIES.indexOf(defaultCategory) >= 0 ? defaultCategory : 'Work';
  String(text || '').split(/\r?\n/).forEach(function (line) {
    var raw = line.trim();
    if (!raw) return;
    if (raw.charAt(0) === '#') { project = cleanText(raw.replace(/^#+\s*/, '')); return; }
    var s = raw, category = category0, done = false, due = '', priority = 'Normal', m, changed = true;
    while (changed) {
      changed = false;

      if (m) { category = /^(work|w)$/i.test(m[1]) ? 'Work' : 'Personal'; s = s.slice(m[0].length); changed = true; }
      m = /^(-\s*\[[xX]\]|\[[xX]\]|✓|✔|☑)\s*/.exec(s);
      if (m) { done = true; s = s.slice(m[0].length); changed = true; }
      m = /^([-*•☐]|\[ \])\s*/.exec(s) || /^\d{1,3}[.)]\s+/.exec(s);
      if (m) { s = s.slice(m[0].length); changed = true; }
    }
    changed = true;

      m = /\s*(!{1,2})$/.exec(s);

    }

  });

/* Regenerates text for importText from edited preview rows, in preview order (so the sheet keeps the document's

   carries [Work]/[Personal], "[x]" when done, " @due" and " !" for High. */
function previewRowsToText(rows) {
  var lines = [], project = '';
  (rows || []).forEach(function (r) {
    if (!r.include || !cleanText(r.title)) return;
    var p = cleanText(r.project);

}

/* Copy agenda as text, in the routine page's format: title, then each section in capitals with numbered "item (detail)" lines. */

    copyText(agendaToText(state.agenda, { directorName: state.config.DIRECTOR_NAME })).then(function () { toast('Agenda copied as text', { type: 'ok' }); }, toastError);
  });
  $('agenda-download').addEventListener('click', function () { if (state.agenda) downloadWorkbook(buildAgendaWorkbookRows(state.agenda, { directorName: state.config.DIRECTOR_NAME })); });
  $('nl-apply').addEventListener('click', loadNewsletter);
  $('nl-copy').addEventListener('click', function () {
    if (!state.nl.markdown) { toast('Nothing to copy yet', { type: 'error' }); return; }
    copyText(state.nl.markdown).then(function () { toast('Newsletter copied as Markdown', { type: 'ok' }); }, toastError);
  });
  $('nl-download').addEventListener('click', function () { downloadWorkbook(buildNewsletterWorkbookRows(state.nl.tasks, { from: state.nl.from, to: state.nl.to })); });
  $('history-filters').addEventListener('submit', function (e) { e.preventDefault(); loadHistory(); });
  readHash(function (hash) { showPage(hash || 'desk'); boot(); });
}
init();
</script>
